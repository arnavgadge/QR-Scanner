# Fine-tuning en_PP-OCRv5_mobile_rec (PaddleOCR v3.7.0, Apache-2.0) on synthetic dot-peen lines.
# Based on configs/rec/PP-OCRv5/multi_language/en_PP-OCRv5_mobile_rec.yaml. Changes:
#  - character set 0-9 A-Z (dict.txt), no space
#  - no RecConAug (it glues two lines together: our plates never have that)
#  - fixed input 48 x 320 for training and validation (SimpleDataSet + RecResizeImg)
#  - lower learning rate, shorter warm-up (fine-tuning, not training from scratch)
# Round 2: learning rate 3e-4 -> 1e-4, cosine over 20 epochs, 1 warm-up epoch (round 1 levelled
# off by epoch 4-6 and had two validation dips at the higher rate).
# Paths (data_dir, label files, dict) are filled in by train_rec.py.
Global:
  model_name: en_PP-OCRv5_mobile_rec
  use_gpu: true
  epoch_num: 20
  character_dict_path: REPLACED
  max_text_length: &max_text_length 25
  use_space_char: false
  distributed: false
  pretrained_model: https://paddle-model-ecology.bj.bcebos.com/paddlex/official_pretrained_model/en_PP-OCRv5_mobile_rec_pretrained.pdparams

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: SimpleDataSet
    data_dir: REPLACED
    label_file_list: [REPLACED]
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - MultiLabelEncode: {gtc_encode: NRTRLabelEncode}
      - RecResizeImg: {image_shape: [3, 48, 320]}
      - KeepKeys: {keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]}
  loader:
    shuffle: true
    batch_size_per_card: 128
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: REPLACED
    label_file_list: [REPLACED]
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - MultiLabelEncode: {gtc_encode: NRTRLabelEncode}
      - RecResizeImg: {image_shape: [3, 48, 320]}
      - KeepKeys: {keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]}
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
